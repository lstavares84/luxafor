[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signa"
version = "0.1.0"
description = "SIGNA: luz de status USB para a sala (Google/Outlook) e para IAs (Claude, ChatGPT, Grok)"
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14", "keyring>=24", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.2", "google-api-python-client>=2.100"]
outlook = ["msal>=1.28", "requests>=2.31"]
tray = ["pystray>=0.19", "Pillow>=10"]
hotkey = ["pynput>=1.7"]
all = ["signa[google,outlook,tray,hotkey]"]
test = ["pytest>=8"]

[project.scripts]
signa-cli = "signa.cli:main"

[tool.setuptools]
packages = ["signa"]

[tool.setuptools.package-data]
signa = ["data/*.json"]
